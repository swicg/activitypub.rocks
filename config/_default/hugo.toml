locale = "en-us"
title = "ActivityPub Rocks!"
# Design lives in themes/<name>; switch designs by changing this.
# theme = "2018"
theme = "agentic"
disableKinds = ["taxonomy", "sitemap"]

[taxonomies]
  tag = "tags"

[permalinks.term]
  tags = "/feeds/tags/:slug"

[params]
  author = "Social Web Community Group (SWICG)"

# Site navigation, for themes that show it.
[[menus.main]]
  name = "Specifications"
  url = "#specs"   # fragment on the home page
  weight = 10
[[menus.main]]
  name = "GitHub"
  url = "https://github.com/swicg/activitypub.rocks"
  weight = 20

[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]

[outputFormats]
  [outputFormats.atom]
    mediaType = "application/atom+xml"
    baseName = "feed"
    isHTML = false
    isPlainText = false
    rel = "alternate"
  [outputFormats.rss]
    mediaType = "application/rss+xml"
    baseName = "rss"
    isHTML = false
    isPlainText = false
    rel = "alternate"

[outputs]
  home = ["html", "atom", "rss"]
  page = ["html"]
  section = ["html"]
  term = ["atom", "rss"]

[markup.goldmark.renderer]
  unsafe = true
