<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
  <head>
    <meta charset="utf-8">
    {{ if site.Params.noindex }}<meta name="robots" content="noindex, nofollow">{{ end }}
    <title>{{ block "title" . }}{{ site.Title }}{{ end }}</title>
    <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
    {{- range site.Home.OutputFormats }}{{ if ne .Name "html" }}
    <link rel="alternate" title="ActivityPub news" type="{{ .MediaType.Type }}" href="{{ .RelPermalink }}">
    {{- end }}{{ end }}
  </head>
  <body>
    <header>
      <a href="{{ site.Home.RelPermalink }}"><img src="{{ "images/ActivityPub-logo.svg" | relURL }}" alt="ActivityPub"></a>
    </header>
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
